name: hola-mundo-trigger

on:
  workflow_dispatch:
    inputs:
      posicion:
        description: Posicion en la empresa
        required: true
        type: string
      antiguedad:
        description: Años en la empresa
        required: true
        type: number
jobs:
  hola-mundo-compile:
    if: ${{ inputs.antiguedad <= 2 }}
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repo en el Runner
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run script
        run: node index.js

      - name: Expresión con funciones
        run: |
          echo "Repositorio ANTIGUO: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          echo "Evento: ${{ github.event_name }}"
  hola-mundo-compile-new:
    if: ${{ inputs.antiguedad > 2 }}
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repo en el Runner
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run script
        run: node index.js

      - name: Expresión con funciones
        run: |
          echo "Repositorio MODERNO: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          echo "Evento: ${{ github.event_name }}"