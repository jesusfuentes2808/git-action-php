name: hola-mundo-trigger
on:
  push:
    branches:
      - 'feature_test/*'
    paths:
      - '**/*.js'
  pull_request:
    types:
      - opened # se ejcuta por primera vez
      - labeled # se ejecuta cuando alguien le agrega una etiqueta el pull_request
    branches: # sobre que rama quiero que se active
      - 'main'
    paths:
      - '**/*.js'
  schedule:
    - cron: '15 22 * * *' # se ejecuta todos los días a las 22:15 horas 
jobs:
  hola-mundo-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repo en el Runner
        uses: actions/checkout@v4
      - name: Setup Node .js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run script
        run: node index.js
      
      - name: Expresión con funciones
        run: |
          echo "El repositorio es: ${{ github.repository }}"
          echo "El actor que ejecutó el workflow es: ${{ github.actor }}"
          echo "Fecha actual: ${{ github.event.head_commit.timestamp || 'No disponible' }}"